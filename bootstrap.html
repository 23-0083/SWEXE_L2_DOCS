<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap基礎演習</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ソフトウェア開発演習</a>

      <div class="navbar-nav">
        <a class="nav-link active" href="#">Home</a>
        <a class="nav-link" href="#">About</a>
        <a class="nav-link" href="#">授業概要</a>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <div class="container mt-4">

    <h1 class="mb-4">Bootstrap基礎演習</h1>

    <!-- アラート -->
    <div class="alert alert-info" role="alert">
      Bootstrapを使ってWebページを作成しています。
    </div>

    <!-- ボタン -->
    <div class="mb-4">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-outline-danger">Danger</button>
    </div>

    <!-- カード3枚 -->
    <div class="row">

      <div class="col">
        <div class="card">
          <img src="img/a.png" class="card-img-top" alt="パソコンを操作している画像">
          <div class="card-body">
            <h5 class="card-title">HTML</h5>
            <p class="card-text">
              HTMLを使ってWebページの基本的な構造を作成します。
            </p>
            <a href="#" class="btn btn-primary">詳しく見る</a>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="img/a.png" class="card-img-top" alt="パソコンを操作している画像">
          <div class="card-body">
            <h5 class="card-title">CSS</h5>
            <p class="card-text">
              CSSを使ってWebページのデザインを整えます。
            </p>
            <a href="#" class="btn btn-success">詳しく見る</a>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="img/a.png" class="card-img-top" alt="パソコンを操作している画像">
          <div class="card-body">
            <h5 class="card-title">Bootstrap</h5>
            <p class="card-text">
              Bootstrapを使って簡単にレイアウトや部品を作成します。
            </p>
            <a href="#" class="btn btn-outline-primary">詳しく見る</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- フッター -->
  <footer class="bg-dark text-white text-center mt-5 p-3">
    <p class="mb-0">
      Copyright&copy; Kindai University 2026 All rights Reserved.
    </p>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
